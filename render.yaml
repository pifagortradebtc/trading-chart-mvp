# Blueprint для Render: Web Service (Next.js) + persistent disk для кеша OHLCV и снимков бэктеста.
#
# Persistent Disk обычно доступен на платных типах сервиса; при ошибке Blueprint уберите блок disk
# и добавьте диск вручную: Dashboard → сервис → Disks → Add Disk → Mount Path = /data

services:
  - type: web
    name: trading-chart-mvp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    disk:
      name: trading-cache
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PERSISTENT_DISK_ROOT
        value: /var/data
      # Базовый пароль на всю платформу (HTTP Basic Auth через middleware).
      # Задаётся в Render Dashboard вручную (sync:false = не из Blueprint).
      # Пустое значение = auth disabled (для локальной разработки).
      - key: RESEARCH_PASSWORD
        sync: false
      # URL Криптофонда для блока «Δ vs Live Fund» в Recommended Tab.
      # Задаётся в Render Dashboard. Без него блок просто не рендерится.
      - key: PIFAGOR_FUND_API_URL
        sync: false
